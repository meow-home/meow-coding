<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    :root {
      --bg: #ffffff;
      --text: #1e1e1e;
      --text-dim: #666666;
      --text-hint: #888888;
      --input-bg: #ffffff;
      --input-border: #cccccc;
      --btn-bg: #f5f5f5;
      --btn-border: #cccccc;
      --btn-text: #1e1e1e;
      --accent: #1565c0;
      --dot-green: #2e7d32;
      --dot-red: #c62828;
      --dot-amber: #f9a825;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161618;
        --text: #ffffff;
        --text-dim: #b0b0b0;
        --text-hint: #808080;
        --input-bg: #1a1a1d;
        --input-border: rgba(255, 255, 255, 0.15);
        --btn-bg: #242428;
        --btn-border: rgba(255, 255, 255, 0.15);
        --btn-text: #ffffff;
        --accent: #007acc;
        --dot-green: #4ade9f;
        --dot-red: #ff5f56;
        --dot-amber: #ffb454;
      }
    }
    body { font-family: system-ui, sans-serif; width: 280px; margin: 0; padding: 12px; color: var(--text); background: var(--bg); }
    h1 { font-size: 14px; margin: 0 0 8px; color: var(--text); }
    .row { margin: 6px 0; font-size: 12px; }
    label { display: block; font-size: 11px; color: var(--text-dim); margin-bottom: 2px; }
    input { width: 100%; box-sizing: border-box; padding: 4px 6px; font-size: 12px; color: var(--text); background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 4px; }
    .status { font-size: 12px; margin-bottom: 8px; color: var(--text); }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
    .dot.green { background: var(--dot-green); }
    .dot.red { background: var(--dot-red); }
    .dot.amber { background: var(--dot-amber); }
    button { margin-top: 8px; padding: 5px 10px; font-size: 12px; border: 1px solid var(--btn-border); border-radius: 4px; background: var(--btn-bg); color: var(--btn-text); cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .hint { font-size: 11px; color: var(--text-hint); margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Meow Browser Bridge</h1>
  <div class="status"><span id="dot" class="dot amber"></span><span id="statusText">Connecting...</span></div>
  <div class="row">
    <label>Bridge port</label>
    <div style="display:flex; gap:4px;">
      <input id="port" type="number" value="3927" />
      <button id="detectBtn" title="Auto-detect Meow port">Detect</button>
    </div>
  </div>
  <div class="row">
    <label>Pairing code</label>
    <input id="code" placeholder="000000" />
  </div>
  <button id="saveBtn" class="primary">Save &amp; connect</button>
  <div class="hint" id="hint">Enter the pairing code shown in Meow.</div>
  <script src="popup.js"></script>
</body>
</html>
