name: build

on:
  push:
    tags: ['v*']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx @electron/rebuild -f -w @lydell/node-pty
      - run: npm run typecheck
      - run: npm test

  build:
    needs: test
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    env:
      AZURE_CLIENT_ID: ${{ matrix.target == 'win' && secrets.AZURE_CLIENT_ID || '' }}
      AZURE_TENANT_ID: ${{ matrix.target == 'win' && secrets.AZURE_TENANT_ID || '' }}
      AZURE_SUBSCRIPTION_ID: ${{ matrix.target == 'win' && secrets.AZURE_SUBSCRIPTION_ID || '' }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ matrix.target == 'win' && secrets.AZURE_TRUSTED_SIGNING_ENDPOINT || '' }}
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ matrix.target == 'win' && secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME || '' }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ matrix.target == 'win' && secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx @electron/rebuild -f -w @lydell/node-pty
      - run: npm run build
      - name: Azure login for Windows code signing
        if: matrix.target == 'win' && env.AZURE_CLIENT_ID != '' && env.AZURE_TRUSTED_SIGNING_ENDPOINT != '' && env.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME != '' && env.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE != ''
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Package
        run: npx electron-builder --${{ matrix.target }} --publish never
      - name: Verify Windows code signature
        if: matrix.target == 'win' && env.AZURE_CLIENT_ID != '' && env.AZURE_TRUSTED_SIGNING_ENDPOINT != '' && env.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME != '' && env.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE != ''
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path release -Filter *.exe
          if ($files.Count -eq 0) { throw "No .exe artifacts found to verify" }
          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature $file.FullName
            if ($sig.Status -ne "Valid") {
              throw "Invalid signature for $($file.FullName): $($sig.Status)"
            }
            Write-Host "Signature OK: $($file.Name)"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: meow-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/*.yml
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The publish job runs in a fresh runner; we must check out the repo so
      # docs/changelogs/changelog-<version>.md is available to read.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Read changelog for this tag
        id: changelog
        shell: bash
        # github.ref_name is a tag like "v0.28.1" → strip the leading "v" and
        # read docs/changelogs/changelog-<version>.md. Fall back to a generic
        # body when the file is missing (e.g. a detached/pre-release tag).
        run: |
          version="${GITHUB_REF_NAME#v}"
          file="docs/changelogs/changelog-${version}.md"
          if [[ -f "$file" ]]; then
            echo "changelog<<CHANGELOG_EOF" >> "$GITHUB_OUTPUT"
            cat "$file" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_OUTPUT"
            echo "CHANGELOG_EOF" >> "$GITHUB_OUTPUT"
          else
            echo "changelog=Changelog not found (${file})" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.changelog }}
          files: artifacts/**/*

  notify:
    needs: [test, build, publish]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram notification
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
        run: |
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "Telegram secrets not set, skipping notification"
            exit 0
          fi
          if [[ "$PUBLISH_RESULT" == "success" ]]; then
            text="✅ Meow Coding ${GITHUB_REF_NAME} built and released"$'\n'"${RELEASE_URL}"
          else
            text="❌ Meow Coding ${GITHUB_REF_NAME} build failed"$'\n'"test: ${TEST_RESULT} · build: ${BUILD_RESULT} · publish: ${PUBLISH_RESULT}"$'\n'"${RUN_URL}"
          fi
          curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" \
            -d "disable_web_page_preview=true" > /dev/null
